[package]
name = "integrator"
version = "0.1.0"
edition = "2021"
authors = ["Manveer Singh"]
license = "MIT"
description = "Integrator: High-Performance macOS & Windows 11 Workstation Fusion"
repository = "https://github.com/Manveer-Singh-99/Integrator"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3.7.0", features = ["image"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
curve25519-dalek = { version = "4", features = ["digest", "zeroize"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[lib]
name = "integrator_core"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1"
