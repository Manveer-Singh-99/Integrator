[package]
name = "integrator"
version = "0.1.0"
edition = "2021"
authors = ["Manveer Singh"]
description = "Integrator: High-Performance macOS & Windows 11 Workstation Fusion"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3.7.0", features = ["image"] }
sha2 = "0.11.1"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
