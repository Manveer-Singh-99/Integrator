[package]
name = "mac_windows_bridge"
version = "0.1.0"
edition = "2021"
authors = ["Manveer Singh"]
description = "High-performance macOS & Windows 11 USB-C Workstation Fusion Bridge"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
